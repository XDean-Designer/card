<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>剑琅联盟 · RTB 会议讲解</title>
<style>
:root{
  --red:#f62e43; --red2:#ff5566; --red-soft:#fff3f4; --red-line:#ffd8dd;
  --gold:#b8893a; --gold-soft:#faf3e6; --gold-line:#ecdcb9;
  --ink:#1a1e26; --muted:#687284; --faint:#9aa3b1;
  --bg:#f6f7f9; --card:#fff; --line:#e6e9ef;
  --blue:#2f6bff; --green:#16a36a; --orange:#e8862d; --purple:#7258d7; --teal:#0fa3a3;
  --shadow:0 10px 30px rgba(28,42,62,.08);
  --radius:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);line-height:1.55}
button{font:inherit;cursor:pointer}
a{color:var(--red);text-decoration:none}
a:hover{text-decoration:underline}

/* 顶栏 */
.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:18px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;white-space:nowrap}
.brand .mark{height:32px;width:auto;border-radius:8px}
.brand b{color:var(--red)}
.brand .tagline{font-weight:400;color:var(--muted);font-size:12px;margin-left:2px}
.nav{display:flex;gap:4px;overflow:auto;scrollbar-width:none;flex:1}
.nav::-webkit-scrollbar{display:none}
.nav a{text-decoration:none;color:#5b6473;padding:8px 12px;border-radius:10px;white-space:nowrap;font-size:13px;font-weight:600}
.nav a:hover{background:var(--red-soft);color:var(--red)}
.nav a.active{background:var(--red-soft);color:var(--red)}
.top-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.tb-link{font-size:13px;color:var(--muted);padding:8px 10px;border-radius:10px;white-space:nowrap}
.tb-link:hover{background:#f0f1f4;text-decoration:none;color:var(--ink)}

main{max-width:1180px;margin:0 auto;padding:0 28px 70px}
.section{padding:30px 0 10px}
.hidden{display:none!important}

/* 首页 hero */
.hero{padding:58px 0 12px}
.eyebrow{color:var(--red);font-size:12px;font-weight:900;letter-spacing:.16em}
.hero h1{font-size:40px;line-height:1.15;margin:12px 0 14px;letter-spacing:-.5px}
.hero h1 em{font-style:normal;color:var(--red)}
.hero .lead{font-size:16px;color:var(--muted);max-width:760px;margin:0 0 6px}
.hero .lead b{color:var(--ink)}
.hero-key{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.hero-key span{padding:7px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:12px;color:var(--muted)}
.hero-key span i{font-style:normal;color:var(--red);font-weight:900}

/* 场景入口大卡片 */
.scene-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:30px}
.scene-card{position:relative;background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px 22px 20px;box-shadow:0 6px 22px rgba(28,42,62,.05);transition:transform .18s,box-shadow .18s,border-color .18s;cursor:pointer;text-align:left;overflow:hidden}
.scene-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:#d6dae2}
.scene-card__accent{position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:22px 0 0 22px}
.scene-card__no{font-size:12px;font-weight:900;letter-spacing:.1em;color:var(--faint)}
.scene-card__head{display:flex;align-items:center;gap:14px;margin-top:12px}
.scene-card__icon{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex-shrink:0}
.scene-card__icon svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.scene-card__name{font-size:20px;font-weight:800;margin:0}
.scene-card__name small{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-top:2px}
.scene-card__desc{font-size:13.5px;color:var(--muted);margin-top:14px;line-height:1.6}
.scene-card__foot{display:flex;align-items:center;justify-content:space-between;margin-top:18px;padding-top:14px;border-top:1px dashed var(--line)}
.scene-card__count{font-size:12px;color:var(--faint)}
.scene-card__count b{color:var(--red)}
.scene-card__go{font-size:13px;font-weight:700;color:var(--red);display:inline-flex;align-items:center;gap:3px}
.scene-card__go svg{width:14px;height:14px}

/* 场景详情页 */
.scene-head{display:flex;align-items:center;gap:18px;margin:34px 0 6px}
.scene-head .back{width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--muted);flex-shrink:0}
.scene-head .back:hover{border-color:var(--red);color:var(--red)}
.scene-head .back svg{width:18px;height:18px}
.scene-head__title{flex:1;min-width:0}
.scene-head__title h1{font-size:28px;margin:0 0 2px;letter-spacing:-.3px}
.scene-head__title .sub{font-size:14px;color:var(--muted)}
.scene-head__icon{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;flex-shrink:0}
.scene-head__icon svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* 流程条 */
.flow-card-wrap{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:18px;box-shadow:0 6px 22px rgba(28,42,62,.05)}
.flow-card-wrap .fc-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;margin:0 0 16px}
.flow-card-wrap .fc-title .fc-eyebrow{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--red);background:var(--red-soft);border:1px solid var(--red-line);padding:3px 9px;border-radius:999px}
.flowstrip{display:flex;gap:10px;align-items:stretch;overflow:auto;padding:4px 2px 14px}
.fnode{min-width:150px;background:#fafbfc;border:1px solid var(--line);border-radius:14px;padding:14px 13px;cursor:pointer;transition:.18s;text-align:left;font-family:inherit;color:var(--ink)}
.fnode:hover{border-color:#cfd4de;background:#fff}
.fnode.selected{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft);background:#fff}
.fnode small{color:var(--red);font-weight:900;font-size:11px;letter-spacing:.06em}
.fnode b{display:block;margin-top:6px;font-size:13px;line-height:1.35}
.farr{align-self:center;color:#a5adba;font-size:20px;flex-shrink:0}
.flow-card{display:grid;grid-template-columns:300px 1fr;gap:20px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:18px}
.flow-copy{padding:4px 2px}
.flow-copy .fc-eyebrow2{color:var(--red);font-size:11px;font-weight:900;letter-spacing:.12em}
.flow-copy h3{font-size:19px;margin:8px 0 8px}
.flow-copy p{color:var(--muted);font-size:14px;margin:0 0 14px;line-height:1.7}
.flow-copy .count{color:var(--faint);font-size:12px}
.flow-copy .count b{color:var(--red)}
.gallery{display:flex;gap:12px;overflow:auto;padding-bottom:4px}
.shot{flex:0 0 168px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:6px;cursor:zoom-in}
.shot img{display:block;width:100%;aspect-ratio:9/18.3;object-fit:cover;object-position:top;border-radius:11px}
.shot span{display:block;text-align:center;color:#677284;font-size:12px;padding:7px 2px 1px;line-height:1.4}
.shot--ph{flex:0 0 168px;background:#fff;border:1.5px dashed #ccd2db;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--faint);cursor:default}
.shot--ph svg{width:26px;height:26px;stroke:#b6becb;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.shot--ph .ph-t{font-size:13px;font-weight:700;color:#9aa3b1}
.shot--ph .ph-d{font-size:11px;color:#b6becb}

/* 场景内案例 */
.case-sec{margin-top:34px}
.case-sec__head{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.case-sec__head h2{font-size:19px;margin:0}
.case-sec__head .n{font-size:12px;color:var(--faint);background:#fff;border:1px solid var(--line);padding:2px 10px;border-radius:999px}
.case-list{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.case-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:0 4px 14px rgba(28,42,62,.04)}
.case-card__tag{display:inline-flex;gap:6px;margin-bottom:8px}
.case-card h3{font-size:16px;margin:0 0 6px;line-height:1.4}
.case-card .story{font-size:13px;color:var(--muted);margin:0 0 12px;line-height:1.65}
.case-card .proof{font-size:13px;color:var(--green);background:#f0faf5;border:1px solid #d2eee0;border-radius:10px;padding:8px 12px;margin-bottom:12px;line-height:1.55}
.case-card .proof b{font-weight:800}
.case-steps{margin-top:4px}
.case-step{display:flex;gap:12px;padding:11px 0;border-top:1px dashed var(--line)}
.case-step:first-of-type{border-top:none;padding-top:0}
.case-step__icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;background:var(--red-soft);color:var(--red)}
.case-step__icon svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.case-step__body{min-width:0}
.case-step__mod{font-size:11px;font-weight:900;color:var(--faint);letter-spacing:.05em}
.case-step__act{font-size:14px;font-weight:700;margin-top:1px}
.case-step__desc{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.55}
.shot-btn{margin-top:8px;height:26px;padding:0 10px;border-radius:8px;border:1px solid var(--red-line);background:var(--red-soft);color:var(--red);font-size:12px;font-weight:700}
.shot-btn:hover{background:#ffe9ec}
.case-upgrades{margin-top:12px;padding:10px 12px;background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:10px;font-size:12.5px;color:#7a5b1e;line-height:1.6}
.case-upgrades b{color:var(--gold)}

/* 底部 */
.foot{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--faint);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
body.present-mode .top-actions .tb-link{display:none}
body.present-mode .nav{display:none}

/* 看图 viewer */
.viewer{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:30px;background:rgba(15,18,25,.82);backdrop-filter:blur(8px)}
.viewer.open{display:flex}
.viewer__panel{position:relative;max-width:min(420px,94vw);max-height:94vh;background:#fff;border-radius:20px;padding:10px 10px 12px;box-shadow:0 30px 80px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:8px}
.viewer__close{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:11px;border:none;background:rgba(0,0,0,.42);color:#fff;font-size:18px;line-height:1;z-index:2}
.viewer__close:hover{background:rgba(0,0,0,.6)}
.viewer img{display:block;width:100%;max-height:calc(94vh - 84px);object-fit:contain;border-radius:14px}
.viewer__cap{font-size:13px;font-weight:700;color:var(--ink);text-align:center;padding:2px 20px}
.viewer__nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.14);color:#fff;font-size:20px;line-height:1}
.viewer__nav:hover{background:rgba(255,255,255,.28)}
.viewer__nav.prev{left:-54px}
.viewer__nav.next{right:-54px}

@media(max-width:900px){
  .scene-grid,.case-list{grid-template-columns:1fr 1fr}
  .flow-card{grid-template-columns:1fr}
  main{padding:0 16px 50px}
  .top{padding:0 14px}
  .hero h1{font-size:30px}
  .viewer__nav.prev{left:-8px}
  .viewer__nav.next{right:-8px}
}
@media(max-width:560px){
  .scene-grid,.case-list{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="top">

</header>

<main>
  <!-- 首页：6 类应用场景入口 -->
  <section class="section" id="viewHome">

        <span><i>6</i> 大应用场景</span>
        <span><i>10</i> 场端到端案例</span>

      <div class="flow-card">
        <div class="flow-copy" id="flowCopy"></div>

      </div>

    <div class="case-sec">

      <div class="case-list" id="sceneCases"></div>

    <div class="foot">
      <span>流程真源：《RTB现有产品概览》《RTB产品重构计划概览》。AI 导入为研发中能力，本页不以现网已上线表述。</span>
      <span>截图待补充的页面，后续替换即可。</span>
    </div>
  </section>
</main>

<div class="viewer" id="viewer" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="viewerCap">
  <button type="button" class="viewer__nav prev" id="viewerPrev" aria-label="上一张">‹</button>
  <div class="viewer__panel">
    <button type="button" class="viewer__close" id="viewerClose" aria-label="关闭">×</button>
    <img id="viewerImg" alt="">
    <div class="viewer__cap" id="viewerCap">现网截图</div>
  </div>
  <button type="button" class="viewer__nav next" id="viewerNext" aria-label="下一张">›</button>
</div>

  function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }

  /* ---------- 首页场景大卡 ---------- */
  function renderSceneGrid() {
    var html = SCENES.map(function (s) {
      var n = (CASES.filter(function (c) { return c.scene === s.id; })).length;
      return '<button type="button" class="scene-card" data-scene="' + s.id + '">' +
        '<span class="scene-card__accent" style="background:' + s.color + '"></span>' +
        '<div class="scene-card__no">' + esc(s.no) + '</div>' +
        '<div class="scene-card__head">' +
          '<span class="scene-card__icon" style="background:' + s.gradient + '">' + ICONS[s.icon] + '</span>' +
          '<div class="scene-card__name">' + esc(s.name) + '</div>' +
        '</div>' +
        '<p class="scene-card__desc">' + esc(s.desc) + '</p>' +
        '<div class="scene-card__foot">' +
          '<span class="scene-card__count"><b>' + n + '</b> 场案例</span>' +
          '<span class="scene-card__go">查看案例 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>' +
        '</div>' +
      '</button>';
    }).join('');
    document.getElementById('sceneGrid').innerHTML = html;
    document.getElementById('sceneGrid').querySelectorAll('[data-scene]').forEach(function (el) {
      el.addEventListener('click', function () { openScene(el.getAttribute('data-scene')); });
    });
  }

  /* ---------- 顶栏导航 ---------- */
  function renderTopNav() {
    var html = '<a href="#viewHome" data-nav="home">首页</a>' + SCENES.map(function (s) {
      return '<a href="#scene-' + s.id + '" data-nav="' + s.id + '">' + esc(s.name) + '</a>';
    }).join('');
    var nav = document.getElementById('topNav');
    nav.innerHTML = html;
    nav.querySelectorAll('a').forEach(function (a) {
      a.addEventListener('click', function (e) {
        e.preventDefault();
        var id = a.getAttribute('data-nav');
        if (id === 'home') goHome();
        else openScene(id);
      });
    });
  }
  function syncNav() {
    document.querySelectorAll('#topNav a').forEach(function (a) {
      a.classList.toggle('active', a.getAttribute('data-nav') === (state.scene || 'home'));
    });
  }

  /* ---------- 场景详情 ---------- */
  function openScene(id) {
    var s = SCENES.find(function (x) { return x.id === id; });
    if (!s) return;
    state.scene = s.id;
    state.flowIdx = 0;
    document.getElementById('viewHome').classList.add('hidden');
    document.getElementById('viewScene').classList.remove('hidden');
    document.getElementById('sceneIcon').innerHTML = '<span style="display:contents">' + ICONS[s.icon] + '</span>';
    document.getElementById('sceneIcon').style.background = s.gradient;
    document.getElementById('sceneTitle').textContent = s.name;
    document.getElementById('sceneSub').textContent = s.no + ' · ' + s.desc;
    document.getElementById('fcTitle').textContent = '核心业务流程 · ' + s.name;
    renderFlowStrip();
    renderFlowDetail();
    renderSceneCases();
    syncNav();
    window.scrollTo(0, 0);
  }

  function renderFlowStrip() {
    var s = SCENES.find(function (x) { return x.id === state.scene; });
    var html = s.flow.map(function (f, i) {
      return '<button type="button" class="fnode ' + (i === state.flowIdx ? 'selected' : '') + '" data-i="' + i + '">' +
        '<small>' + String(i + 1).padStart(2, '0') + '</small><b>' + esc(f.t) + '</b></button>' +
        (i < s.flow.length - 1 ? '<span class="farr">›</span>' : '');
    }).join('');
    var strip = document.getElementById('sceneFlow');
    strip.innerHTML = html;
    strip.querySelectorAll('.fnode').forEach(function (n) {
      n.addEventListener('click', function () {
        state.flowIdx = Number(n.getAttribute('data-i'));
        renderFlowStrip();
        renderFlowDetail();
      });
    });
  }

  function renderFlowDetail() {
    var s = SCENES.find(function (x) { return x.id === state.scene; });
    var f = s.flow[state.flowIdx];
    var shots = f.shots || [];
    document.getElementById('flowCopy').innerHTML =
      '<span class="fc-eyebrow2">' + esc(s.no) + ' · ' + String(state.flowIdx + 1).padStart(2, '0') + '</span>' +
      '<h3>' + esc(f.t) + '</h3>' +
      '<p>' + esc(f.d) + '</p>' +
      '<div class="count">' + (shots.length ? '<b>' + shots.length + '</b> 张页面截图' : '截图待补充') + '</div>';
    renderGallery(shots, document.getElementById('flowGallery'));
  }

  function renderGallery(shots, container) {
    var html;
    if (!shots.length) {
      html = '<div class="shot--ph"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 20l3-4 3 4M12 5v3"/></svg><span class="ph-t">截图待补充</span><span class="ph-d">页面截图整理中 · 后续替换</span></div>';
    } else {
      html = shots.map(function (sh, i) {
        return '<div class="shot" data-shot="' + esc(sh) + '" data-cap="' + esc(flowShotLabel(sh)) + '">' +
          '<img src="' + SHOT_BASE + esc(sh) + '.png" alt="' + esc(flowShotLabel(sh)) + '" loading="lazy">' +
          '<span>' + esc(flowShotLabel(sh)) + '</span></div>';
      }).join('');
    }
    container.innerHTML = html;
    wireShotList(container);
  }

  function flowShotLabel(id) {
    var map = {
      '01-wb-home': '工作台首页', '02-bill-entry': '开单 · 选品', '03-bill-items': '开单 · 结算',
      '04-bill-pay': '开单 · 收款', '05-appt-list': '预约看板', '08-price-list': '价目表 · 项目',
      '08b-price-products': '价目表 · 产品', '09-price-edit': '产品增改', '10b-inventory-manage': '库存管理',
      '11-card-manage': '卡管理', '12-coupon': '优惠券', '17-report-hub': '经营分析',
      '18-report-detail': '门店经营报表', '20-expense-book': '支出 · 记一笔', '21-expense-stats': '支出统计',
      '22-staff-create': '创建员工', '23-staff-perm': '选择权限', '24-staff-commission': '提成设置',
      '25-staff-performance': '业绩设置', '26-staff-reward': '奖惩设置', '27-staff-appt': '预约 · 选手艺人'
    };
    return map[id] || id;
  }

  /* ---------- 场景内案例 ---------- */
  function renderSceneCases() {
    var list = CASES.filter(function (c) { return c.scene === state.scene; });
    document.getElementById('caseCount').textContent = list.length + ' 场';
    document.getElementById('sceneCases').innerHTML = list.map(function (c) { return caseCardHtml(c); }).join('');
    document.getElementById('sceneCases').querySelectorAll('[data-shot]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        openViewer([el.getAttribute('data-shot')], el.getAttribute('data-cap') || '');
      });
    });
    document.getElementById('sceneCases').querySelectorAll('[data-shots]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        openViewer(JSON.parse(el.getAttribute('data-shots')));
      });
    });
  }

  function caseCardHtml(c) {
    var steps = c.steps.map(function (s) {
      var shotHtml = '';
      var list = s.shots || (s.shot ? [s.shot] : []);
      if (list.length) {
        var label = s.shots ? (s.shots.length + ' 张截图') : (s.shotLabel || s.mod);
        shotHtml = '<div><button type="button" class="shot-btn" ' +
          (s.shots ? 'data-shots="' + esc(JSON.stringify(s.shots)) + '"' : 'data-shot="' + esc(s.shot) + '" data-cap="' + esc(s.shotLabel || s.mod) + '"') +
          '>查看截图 · ' + esc(label) + '</button></div>';
      }
      return '<div class="case-step">' +
        '<span class="case-step__icon">' + (ICONS[s.icon] || ICONS.bill) + '</span>' +
        '<div class="case-step__body">' +
          '<div class="case-step__mod">' + esc(s.mod) + '</div>' +
          '<div class="case-step__act">' + esc(s.act) + '</div>' +
          '<div class="case-step__desc">' + esc(s.desc) + '</div>' +
          shotHtml +
        '</div></div>';
    }).join('');
    var ups = c.upgrades && c.upgrades.length ? '<div class="case-upgrades"><b>下一步更锋利 ·</b> ' + c.upgrades.map(function (u) { return esc(u); }).join('　') + '</div>' : '';
    return '<div class="case-card">' +
      '<div class="case-card__tag"><span class="fc-eyebrow">' + esc(c.id) + '</span></div>' +
      '<h3>' + esc(c.title) + '</h3>' +
      '<p class="story">' + esc(c.story) + '</p>' +
      '<div class="proof"><b>现网可完成 ·</b> ' + esc(c.proof) + '</div>' +
      '<div class="case-steps">' + steps + '</div>' +
      ups +
    '</div>';
  }

  /* ---------- 看图 viewer ---------- */
  function wireShotList(container) {
    container.querySelectorAll('.shot[data-shot]').forEach(function (el) {
      el.addEventListener('click', function () {
        openViewer([el.getAttribute('data-shot')], el.getAttribute('data-cap') || '');
      });
    });
  }
  function openViewer(shots, cap) {
    viewerList = shots.slice();
    viewerIdx = 0;
    var s = SCENES.find(function (x) { return x.id === state.scene; });
    showViewer(cap || (s ? s.name : ''));
  }
  function showViewer(cap) {
    var img = document.getElementById('viewerImg');
    img.src = SHOT_BASE + viewerList[viewerIdx] + '.png';
    img.alt = cap;
    document.getElementById('viewerCap').textContent = cap + ' · ' + (viewerIdx + 1) + '/' + viewerList.length;
    var viewer = document.getElementById('viewer');
    viewer.classList.add('open');
    viewer.setAttribute('aria-hidden', 'false');
    document.getElementById('viewerPrev').style.visibility = viewerList.length > 1 ? 'visible' : 'hidden';
    document.getElementById('viewerNext').style.visibility = viewerList.length > 1 ? 'visible' : 'hidden';
  }
  function moveViewer(delta) {
    if (!viewerList.length) return;
    viewerIdx = (viewerIdx + delta + viewerList.length) % viewerList.length;
    showViewer(document.getElementById('viewerCap').textContent.split(' · ')[0]);
  }
  function closeViewer() {
    var viewer = document.getElementById('viewer');
    viewer.classList.remove('open');
    viewer.setAttribute('aria-hidden', 'true');
    document.getElementById('viewerImg').removeAttribute('src');
    viewerList = [];
  }

  /* ---------- 导航 ---------- */
  function goHome() {
    state.scene = null;
    document.getElementById('viewScene').classList.add('hidden');
    document.getElementById('viewHome').classList.remove('hidden');
    syncNav();
    window.scrollTo(0, 0);
  }

  /* ---------- 讲解模式 ---------- */
  document.getElementById('btnPresent').addEventListener('click', function () {
    document.body.classList.toggle('present-mode');
    this.textContent = document.body.classList.contains('present-mode') ? '讲解模式 · 开' : '讲解模式';
  });
  document.getElementById('btnBackHome').addEventListener('click', goHome);
  document.getElementById('viewerClose').addEventListener('click', closeViewer);
  document.getElementById('viewer').addEventListener('click', function (e) { if (e.target === this) closeViewer(); });
  document.getElementById('viewerPrev').addEventListener('click', function () { moveViewer(-1); });
  document.getElementById('viewerNext').addEventListener('click', function () { moveViewer(1); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && document.getElementById('viewer').classList.contains('open')) { e.preventDefault(); closeViewer(); return; }
    if (!document.getElementById('viewer').classList.contains('open')) {
      if (e.key === 'ArrowRight' || e.key === 'PageDown') {
        e.preventDefault();
        var idx = SCENES.findIndex(function (s) { return s.id === state.scene; });
        if (idx >= 0) { var next = SCENES[(idx + 1) % SCENES.length]; openScene(next.id); }
      }
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        if (!state.scene) return;
        var i2 = SCENES.findIndex(function (s) { return s.id === state.scene; });
        var prev = SCENES[(i2 - 1 + SCENES.length) % SCENES.length];
        openScene(prev.id);
      }
    }
  });

  function goFromHash() {
    var q = new URLSearchParams(location.search).get('scene');
    var h = (location.hash || '').replace(/^#\//, '');
    var m = /^#scene-(.+)$/.exec(h || '');
    var id = q || (m ? m[1] : '');
    if (id && SCENES.some(function (s) { return s.id === id; })) openScene(id);
  }

  renderTopNav();
  renderSceneGrid();
  goHome();
  goFromHash();
})();
</script>
</body>
</html>
